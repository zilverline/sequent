name: rspec

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

env:
  SEQUENT_ENV: test
  RAILS_ENV: test
  POSTGRES_USERNAME: sequent
  POSTGRES_PASSWORD: sequent
  POSTGRES_DB: sequent_spec_db

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - ruby-version: '3.3'
            gemfile: 'ar_7_2'
          - ruby-version: '3.4'
            gemfile: 'ar_8_0'
          - ruby-version: '4.0'
            gemfile: 'ar_8_0'
          - ruby-version: '4.0'
            gemfile: 'ar_8_1'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: sequent
          POSTGRES_PASSWORD: sequent
          POSTGRES_DB: sequent_spec_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Install PostgreSQL 16 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Setup database
        run: |
          bundle exec rake sequent:db:drop sequent:db:create
      - name: Run tests
        run: bundle exec rspec --order random

  rubocop:
    runs-on: ubuntu-26.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/ar_8_1.gemfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: rubocop
        uses: reviewdog/action-rubocop@v2
        with:
          skip_install: true
          use_bundler: true
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check

  integration_simple:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: 'integration-specs/simple'
      - name: Run integration tests simple
        run: |
          cd integration-specs/simple
          bundle exec rspec

  integration_rails:
    env:
      POSTGRES_DB: sequent_integration_test_db
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: sequent
          POSTGRES_PASSWORD: sequent
          POSTGRES_DB: sequent_integration_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: 'integration-specs/rails-app'
      - name: Install PostgreSQL 16 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Run integration tests rails-app
        run: |
          cd integration-specs/rails-app
          bundle exec rake sequent:install:migrations
          bundle exec rake db:create db:migrate
          bundle exec rspec spec
